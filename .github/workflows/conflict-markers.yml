name: conflict-markers

on:
  push:
    branches: ["**"]
  pull_request:
  # GitHub can skip push events when one push carries several branches and tags at
  # once; run it by hand per branch with: gh workflow run conflict-markers.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No merge-conflict markers in the tree
        run: sh scripts/check-conflict-markers.sh
